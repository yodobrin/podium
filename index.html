<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>podium</title>
<meta name="description" content="Talks, decks and guides on working well with AI.">
<style>
:root{
  color-scheme:light;
  --bg:#f8fafc;--surface:#ffffff;--surface-2:#f1f5f9;
  --border:rgba(71,85,105,.18);--border-strong:rgba(71,85,105,.35);
  --text-1:#1e293b;--text-2:#475569;--text-3:#64748b;
  --accent:#0d9488;--accent-strong:#0f766e;--accent-soft:#ccfbf1;--on-accent:#ffffff;
  --grad:linear-gradient(135deg,#0d9488,#14b8a6);
  --shadow:0 1px 3px rgba(30,41,59,.06),0 4px 12px rgba(30,41,59,.05);
  --shadow-lg:0 4px 12px rgba(30,41,59,.08),0 18px 36px rgba(30,41,59,.08);
  --radius:12px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#0f172a;--surface:#1e293b;--surface-2:#172033;
    --border:rgba(226,232,240,.16);--border-strong:rgba(226,232,240,.32);
    --text-1:#f1f5f9;--text-2:#cbd5e1;--text-3:#94a3b8;
    --accent:#5eead4;--accent-strong:#5eead4;--accent-soft:#134e4a;--on-accent:#134e4a;
    --grad:linear-gradient(135deg,#5eead4,#99f6e4);
    --shadow:0 1px 3px rgba(0,0,0,.28),0 4px 12px rgba(0,0,0,.2);
    --shadow-lg:0 4px 12px rgba(0,0,0,.32),0 18px 36px rgba(0,0,0,.28);
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text-1);font-family:var(--font);
  line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent-strong)}
.wrap{max-width:1180px;margin:0 auto;padding:56px 28px 80px}
header h1{margin:0;font-size:44px;letter-spacing:-.03em;line-height:1.1}
header h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:10px 0 0;color:var(--text-2);font-size:19px;max-width:640px}

.tools{margin-top:36px;display:flex;flex-direction:column;gap:18px}
.search{position:relative;max-width:520px}
.search input{width:100%;font:inherit;font-size:17px;padding:12px 16px 12px 44px;border-radius:999px;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--text-1)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-3)}
.facet{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.facet h2{margin:0 6px 0 0;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-3);min-width:84px}
.chip{font:inherit;font-size:15px;padding:6px 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);
  display:inline-flex;align-items:center;gap:8px;transition:background .15s,color .15s,border-color .15s}
.chip:hover{border-color:var(--accent)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip .n{font-size:12px;color:var(--text-3)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}
.chip:disabled{opacity:.45;cursor:default}
.status{display:flex;align-items:center;gap:14px;color:var(--text-3);font-size:15px;min-height:24px}
.clear{font:inherit;font-size:15px;background:none;border:0;color:var(--accent-strong);cursor:pointer;padding:0;text-decoration:underline}

.grid{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px}
.card{display:flex;flex-direction:column;gap:12px;padding:24px 26px;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--accent);
  box-shadow:var(--shadow);text-decoration:none;color:inherit;transition:box-shadow .2s,transform .2s}
.card:hover,.card:focus-visible{box-shadow:var(--shadow-lg);transform:translateY(-2px);outline:none}
.card .meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.card .type{color:var(--accent-strong)}
.card h3{margin:0;font-size:22px;line-height:1.25;letter-spacing:-.01em;color:var(--text-1)}
.card p{margin:0;color:var(--text-2);font-size:16px}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.card .tag{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.card .open{font-weight:600;color:var(--accent-strong);font-size:15px}
.empty{margin-top:28px;padding:40px;text-align:center;border:1px dashed var(--border-strong);border-radius:var(--radius);color:var(--text-2)}
footer{margin-top:64px;color:var(--text-3);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>podium</span></h1>
    <p>Talks, decks and guides on working well with AI. Filter by topic or audience, then open any item in your browser.</p>
  </header>

  <section class="tools" aria-label="Filters">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search titles and summaries" aria-label="Search">
    </label>
    <div id="facets"></div>
    <div class="status" aria-live="polite"><span id="count"></span><button id="clear" class="clear" type="button" hidden>Clear filters</button></div>
  </section>

  <main>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden>No items match these filters. <button class="clear" type="button" data-clear>Clear filters</button></div>
  </main>

  <footer>Published from a private workspace. Content is shared as is.</footer>
</div>

<script>
(() => {
  const FACETS = [
    { key: "type", label: "Type", get: i => [i.type] },
    { key: "topic", label: "Topic", get: i => i.topics || [] },
    { key: "audience", label: "Audience", get: i => i.audience || [] },
    { key: "language", label: "Language", get: i => [i.language] },
    { key: "year", label: "Year", get: i => [String(i.date || "").slice(0, 4)] },
  ];
  const LABELS = { deck: "Deck", doc: "Document", guide: "Guide", en: "English", he: "Hebrew" };
  const label = v => LABELS[v] || v.replace(/-/g, " ").replace(/^./, c => c.toUpperCase());
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const $q = document.getElementById("q"), $facets = document.getElementById("facets"),
        $grid = document.getElementById("grid"), $empty = document.getElementById("empty"),
        $count = document.getElementById("count"), $clear = document.getElementById("clear");
  let items = [];
  const sel = {};
  FACETS.forEach(f => sel[f.key] = new Set());

  function readUrl() {
    const p = new URLSearchParams(location.search);
    $q.value = p.get("q") || "";
    FACETS.forEach(f => { sel[f.key] = new Set((p.get(f.key) || "").split(",").filter(Boolean)); });
  }
  function writeUrl() {
    const p = new URLSearchParams();
    if ($q.value.trim()) p.set("q", $q.value.trim());
    FACETS.forEach(f => { if (sel[f.key].size) p.set(f.key, [...sel[f.key]].join(",")); });
    const s = p.toString();
    history.replaceState(null, "", s ? "?" + s : location.pathname);
  }
  const matchesText = i => {
    const q = $q.value.trim().toLowerCase();
    return !q || (i.title + " " + i.summary).toLowerCase().includes(q);
  };
  const matchesFacets = (i, skip) => FACETS.every(f =>
    f.key === skip || !sel[f.key].size || f.get(i).some(v => sel[f.key].has(v)));

  function render() {
    // A facet is shown only when at least one of its values would narrow the catalog.
    $facets.innerHTML = "";
    FACETS.forEach(f => {
      const all = new Map(), total = new Map();
      items.forEach(i => f.get(i).forEach(v => { if (v) { all.set(v, 0); total.set(v, (total.get(v) || 0) + 1); } }));
      if (![...total.values()].some(n => n < items.length)) return;
      items.filter(i => matchesText(i) && matchesFacets(i, f.key))
           .forEach(i => f.get(i).forEach(v => all.set(v, all.get(v) + 1)));
      const row = document.createElement("div");
      row.className = "facet"; row.setAttribute("role", "group"); row.setAttribute("aria-label", f.label);
      row.innerHTML = `<h2>${f.label}</h2>`;
      [...all.keys()].sort().forEach(v => {
        const on = sel[f.key].has(v), n = all.get(v);
        const b = document.createElement("button");
        b.type = "button"; b.className = "chip";
        b.setAttribute("aria-pressed", on);
        b.disabled = !on && n === 0;
        b.innerHTML = `${esc(label(v))}<span class="n">${n}</span>`;
        b.onclick = () => { on ? sel[f.key].delete(v) : sel[f.key].add(v); update(); };
        row.appendChild(b);
      });
      $facets.appendChild(row);
    });

    const shown = items.filter(i => matchesText(i) && matchesFacets(i));
    $grid.innerHTML = shown.map(i => `
      <a class="card" href="${esc(i.path)}">
        <div class="meta"><span class="type">${esc(label(i.type))}</span><span>${esc(i.date || "")}</span><span>${esc(label(i.language || ""))}</span></div>
        <h3>${esc(i.title)}</h3>
        <p>${esc(i.summary)}</p>
        <div class="tags">${[...(i.topics || []), ...(i.audience || [])].map(t => `<span class="tag">${esc(label(t))}</span>`).join("")}</div>
        <span class="open">Open &rarr;</span>
      </a>`).join("");
    $empty.hidden = shown.length > 0 || items.length === 0;
    const filtered = $q.value.trim() || FACETS.some(f => sel[f.key].size);
    $count.textContent = items.length === 0 ? "Nothing published yet."
      : filtered ? `${shown.length} of ${items.length} items` : `${items.length} item${items.length === 1 ? "" : "s"}`;
    $clear.hidden = !filtered;
  }
  function update() { writeUrl(); render(); }
  function clearAll() { $q.value = ""; FACETS.forEach(f => sel[f.key].clear()); update(); }

  $q.addEventListener("input", update);
  $clear.addEventListener("click", clearAll);
  document.querySelector("[data-clear]").addEventListener("click", clearAll);

  fetch("catalog.json", { cache: "no-cache" })
    .then(r => r.ok ? r.json() : { items: [] })
    .catch(() => ({ items: [] }))
    .then(d => { items = d.items || []; readUrl(); render(); });
})();
</script>
</body>
</html>
